<style>
* { margin: 0; padding: 0; box-sizing: border-box; cursor: none !important; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #020108; font-family: 'Space Grotesk', sans-serif; color: #e8e0f5; -webkit-font-smoothing: antialiased; }

/* ---- BACKGROUND CANVAS ---- */
#bg { position: fixed; inset: 0; z-index: 0; }

/* ---- VIGNETTE ---- */
.vig {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background: radial-gradient(ellipse 55% 55% at 50% 50%, transparent 5%, rgba(2,1,8,0.6) 45%, rgba(2,1,8,0.96) 100%);
}

/* ---- TOP BAR ---- */
.brand {
  position: fixed; top: 22px; left: 28px; z-index: 20;
  font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #4a3f6a;
  display: flex; align-items: center; gap: 8px;
}
.sdot { width: 7px; height: 7px; border-radius: 50%; background: #36d47e; box-shadow: 0 0 8px #36d47e; animation: blink 2s infinite; flex-shrink: 0; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

.ham {
  position: fixed; top: 20px; right: 28px; z-index: 30;
  background: none; border: none; display: flex; flex-direction: column; gap: 5px; padding: 6px;
}
.ham span { display: block; width: 22px; height: 1.5px; background: #4a3f6a; border-radius: 2px; transition: all .3s; }
.ham:hover span { background: #a78bfa; }
.ham.open span:nth-child(1) { transform: rotate(45deg) translate(4.5px, 4.5px); }
.ham.open span:nth-child(2) { opacity: 0; }
.ham.open span:nth-child(3) { transform: rotate(-45deg) translate(4.5px, -4.5px); }

/* ---- SLIDE PANEL ---- */
.overlay { position: fixed; inset: 0; z-index: 25; pointer-events: none; transition: background .3s; }
.overlay.open { background: rgba(4,3,10,0.72); pointer-events: auto; }
.panel {
  position: fixed; top: 0; right: -280px; width: 260px; height: 100%; z-index: 26;
  background: rgba(8,5,18,0.97); backdrop-filter: blur(20px);
  border-left: 1px solid rgba(167,139,250,0.1);
  padding: 70px 32px 32px; transition: right .35s cubic-bezier(.4,0,.2,1);
}
.panel.open { right: 0; }
.panel-x { position: absolute; top: 20px; right: 20px; background: none; border: none; color: #5a4f80; font-size: 22px; line-height: 1; }
.panel-x:hover { color: #a78bfa; }
.panel nav { display: flex; flex-direction: column; }
.panel nav a {
  color: #9388b8; text-decoration: none; font-size: 15px; font-weight: 500;
  padding: 13px 0; border-bottom: 1px solid rgba(167,139,250,0.07);
  display: flex; align-items: center; gap: 12px; transition: color .2s, padding-left .2s;
}
.panel nav a:hover { color: #e8e0f5; padding-left: 6px; }
.panel nav a:last-child { border-bottom: none; }
.panel nav a svg { width: 16px; height: 16px; fill: currentColor; opacity: 0.5; flex-shrink: 0; }

/* ---- GLASS BOX ---- */
.center { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; text-align: center; }
.glass {
  background: rgba(20,12,42,0.72);
  backdrop-filter: blur(28px) saturate(200%);
  -webkit-backdrop-filter: blur(28px) saturate(200%);
  border: 1px solid rgba(167,139,250,0.35);
  border-radius: 20px;
  padding: 22px 32px 26px;
  position: relative;
  overflow: hidden;
  box-shadow:
    0 0 0 1px rgba(167,139,250,0.1) inset,
    0 0 40px rgba(167,139,250,0.06) inset,
    0 20px 60px rgba(0,0,0,0.8),
    0 0 80px rgba(167,139,250,0.08);
  animation: fadeUp .6s .2s both;
}
.glass::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 50% 120%, rgba(167,139,250,0.12) 0%, transparent 70%),
    radial-gradient(ellipse 40% 40% at 20% 50%, rgba(249,168,212,0.06) 0%, transparent 60%),
    radial-gradient(ellipse 40% 40% at 80% 50%, rgba(100,200,255,0.05) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
  border-radius: 20px;
}
.glass::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(167,139,250,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(167,139,250,0.04) 1px, transparent 1px);
  background-size: 24px 24px;
  pointer-events: none;
  z-index: 0;
  border-radius: 20px;
}
.tline, .icons { position: relative; z-index: 1; }
.tline {
  font-family: 'JetBrains Mono', monospace; font-size: 12.5px;
  color: #6b5f90; letter-spacing: 0.05em; margin-bottom: 20px; white-space: nowrap;
}
.tline .c1 { color: #a78bfa; }
.tline .c2 { color: #f9a8d4; }
.icons { display: flex; gap: 11px; justify-content: center; }
.ic {
  width: 46px; height: 46px; border-radius: 50%;
  border: 1px solid rgba(167,139,250,0.25);
  background: rgba(25,15,50,0.85);
  display: flex; align-items: center; justify-content: center;
  text-decoration: none; color: #6b5f90;
  transition: transform .3s cubic-bezier(.34,1.56,.64,1), border-color .25s, color .25s, background .25s, box-shadow .25s;
  position: relative;
}
.ic svg { width: 20px; height: 20px; fill: currentColor; }
.ic::after {
  content: attr(data-t); position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%);
  font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #4a3f70;
  white-space: nowrap; opacity: 0; transition: opacity .2s; pointer-events: none;
}
.ic:hover::after { opacity: 1; }
.ic:hover { transform: translateY(-6px) scale(1.12); }
.ic.i1:hover { border-color: rgba(159,239,131,.65); color: #9fef83; background: rgba(159,239,131,.07); box-shadow: 0 8px 26px rgba(159,239,131,.22); }
.ic.i2:hover { border-color: rgba(210,210,210,.45); color: #ddd; background: rgba(210,210,210,.05); box-shadow: 0 8px 22px rgba(200,200,200,.1); }
.ic.i3:hover { border-color: rgba(100,160,220,.6); color: #7ab8f5; background: rgba(100,160,220,.07); box-shadow: 0 8px 26px rgba(10,102,194,.18); }
.ic.i4:hover { border-color: rgba(167,139,250,.6); color: #c4b5fd; background: rgba(167,139,250,.07); box-shadow: 0 8px 26px rgba(167,139,250,.2); }
.ic.i5:hover { border-color: rgba(249,168,212,.6); color: #f9a8d4; background: rgba(249,168,212,.07); box-shadow: 0 8px 26px rgba(249,168,212,.2); }
.ic.i6:hover { border-color: rgba(251,191,36,.6); color: #fbbf24; background: rgba(251,191,36,.05); box-shadow: 0 8px 26px rgba(251,191,36,.15); }


/* guardian art */
.guardian {
  display: block;
  width: min(540px, 82vw);
  margin: 0 auto 6px;
  mix-blend-mode: multiply;
  position: relative; z-index: 1;
  filter: drop-shadow(0 0 18px rgba(200,30,20,0.6)) drop-shadow(0 0 40px rgba(180,20,10,0.3));

  pointer-events: none;
}
@keyframes guardianFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

@keyframes fadeUp { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform: translateY(0); } }

@media(max-width:720px){ #cd,#cm,#co,#cc{ display:none; } *{ cursor:auto!important; } }

#lshow:hover { transform: translateY(-2px); }
#lbub {
  position:fixed; left:16px; bottom:310px; max-width:210px; z-index:95;

@media(max-width:720px){ #lw,#lbub{ display:none; } }
@media(prefers-reduced-motion:reduce){ #lw{ display:none; } }
</style>

<script>
// ---- MENU ----
function toggleMenu() {

// ---- BACKGROUND: dark circuit art ----
(function() {
  var bg = document.getElementById('bg');
  var ctx = bg.getContext('2d');
  var W, H, t = 0;
  var traces = [];

  function rand(a, b) { return a + Math.random() * (b - a); }
  function randi(a, b) { return Math.floor(rand(a, b)); }

  function init() {
    W = bg.width = window.innerWidth;
    H = bg.height = window.innerHeight;
    traces = [];
    var colors = [
      [90, 50, 160],
      [120, 40, 90],
      [40, 80, 140],
      [60, 30, 120],
      [100, 60, 160]
    ];
    for (var i = 0; i < 180; i++) {
      var col = colors[randi(0, colors.length)];
      var pts = [];
      var sx = rand(0, W);
      var sy = rand(0, H);
      var px = sx, py = sy;
      var angle = randi(0, 4) * 90;
      var steps = randi(2, 7);
      for (var s = 0; s < steps; s++) {
        var len = rand(20, 100);
        var rad = angle * Math.PI / 180;
        var nx = px + Math.cos(rad) * len;
        var ny = py + Math.sin(rad) * len;
        pts.push([px, py, nx, ny]);
        px = nx; py = ny;
        angle += (Math.random() < 0.5 ? 90 : -90);
      }
      traces.push({
        pts: pts,
        r: col[0], g: col[1], b: col[2],
        flow: Math.random(),
        speed: rand(0.003, 0.009),
        alpha: rand(0.12, 0.45)
      });
    }
  }
  init();
  window.addEventListener('resize', init);

  var mx = 0, my = 0;
  window.addEventListener('mousemove', function(e) { mx = e.clientX; my = e.clientY; }, { passive: true });

  function draw() {
    ctx.clearRect(0, 0, W, H);
    t += 0.007;

    // grid
    ctx.lineWidth = 0.5;
    ctx.strokeStyle = 'rgba(20,12,40,0.55)';
    for (var x = 0; x < W; x += 55) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (var y = 0; y < H; y += 55) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    for (var i = 0; i < traces.length; i++) {
      var tr = traces[i];
      var a = tr.alpha * (0.6 + 0.4 * Math.sin(t + i * 0.3));

      // mouse proximity
      var dx = tr.pts[0][0] - mx;
      var dy = tr.pts[0][1] - my;
      var dist = Math.sqrt(dx * dx + dy * dy);
      var prox = Math.max(0, 1 - dist / 380);
      a += prox * 0.5;

      // draw lines
      for (var s = 0; s < tr.pts.length; s++) {
        var seg = tr.pts[s];
        ctx.beginPath();
        ctx.moveTo(seg[0], seg[1]);
        ctx.lineTo(seg[2], seg[3]);
        ctx.strokeStyle = 'rgba(' + tr.r + ',' + tr.g + ',' + tr.b + ',' + a + ')';
        ctx.lineWidth = prox > 0.1 ? 1.1 : 0.75;
        ctx.stroke();
        // corner dot
        ctx.beginPath();
        ctx.arc(seg[2], seg[3], 1.5, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(' + tr.r + ',' + tr.g + ',' + tr.b + ',' + (a * 1.5) + ')';
        ctx.fill();
      }

      // flowing dot
      tr.flow = (tr.flow + tr.speed) % 1;
      var n = tr.pts.length;
      if (n > 0) {
        var idx = Math.floor(tr.flow * n);
        var frac = (tr.flow * n) % 1;
        if (idx < n) {
          var seg2 = tr.pts[idx];
          var fx = seg2[0] + (seg2[2] - seg2[0]) * frac;
          var fy = seg2[1] + (seg2[3] - seg2[1]) * frac;
          var fa = 0.7 + 0.3 * Math.sin(t * 4 + i);
          ctx.beginPath();
          ctx.arc(fx, fy, prox > 0.1 ? 2.5 : 1.8, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(' + tr.r + ',' + tr.g + ',' + tr.b + ',' + fa + ')';
          ctx.shadowBlur = prox > 0.1 ? 14 : 6;
          ctx.shadowColor = 'rgba(' + tr.r + ',' + tr.g + ',' + tr.b + ',0.9)';
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      }
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

// ---- CURSOR ----
(function() {
  var cd = document.getElementById('cd');
  var cm = document.getElementById('cm');
  var co = document.getElementById('co');
  var cc = document.getElementById('cc');
  if (!cd) return;
  var ctx = cc ? cc.getContext('2d') : null;
  if (cc) {
    cc.width = window.innerWidth; cc.height = window.innerHeight;
    window.addEventListener('resize', function() { cc.width = window.innerWidth; cc.height = window.innerHeight; });
  }
  var mx = 0, my = 0, dx = 0, dy = 0, mx2 = 0, my2 = 0, ox = 0, oy = 0, shown = false;
  window.addEventListener('mousemove', function(e) {
    mx = e.clientX; my = e.clientY;
    if (!shown) { cd.style.opacity = '1'; cm.style.opacity = '1'; co.style.opacity = '1'; shown = true; }
  }, { passive: true });
  window.addEventListener('mouseleave', function() {
    cd.style.opacity = '0'; cm.style.opacity = '0'; co.style.opacity = '0'; shown = false;
  });
  (function loop() {
    dx += (mx - dx) * 0.6; dy += (my - dy) * 0.6;
    mx2 += (mx - mx2) * 0.14; my2 += (my - my2) * 0.14;
    ox += (mx - ox) * 0.06; oy += (my - oy) * 0.06;
    cd.style.transform = 'translate(' + (dx - 3.5) + 'px,' + (dy - 3.5) + 'px)';
    cm.style.transform = 'translate(' + (mx2 - 12) + 'px,' + (my2 - 12) + 'px)';
    co.style.transform = 'translate(' + (ox - 22) + 'px,' + (oy - 22) + 'px)';
    requestAnimationFrame(loop);
  })();
  var particles = [];
  function spawnP(x, y) {
    for (var i = 0; i < 16; i++) {
      var angle = Math.random() * Math.PI * 2;
      var speed = 1.5 + Math.random() * 4;
      particles.push({ x: x, y: y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 1, size: 1.2 + Math.random() * 2.2, warm: Math.random() > 0.5 });
    }
  }
  window.addEventListener('click', function(e) { spawnP(e.clientX, e.clientY); });
  if (ctx) {
    (function animP() {
      ctx.clearRect(0, 0, cc.width, cc.height);
      for (var i = particles.length - 1; i >= 0; i--) {
        var p = particles[i];
        p.x += p.vx; p.y += p.vy; p.vx *= 0.91; p.vy *= 0.91; p.life -= 0.032;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        if (p.warm) { ctx.fillStyle = 'rgba(167,139,250,' + p.life + ')'; ctx.shadowColor = 'rgba(167,139,250,0.8)'; }
        else { ctx.fillStyle = 'rgba(249,168,212,' + p.life + ')'; ctx.shadowColor = 'rgba(249,168,212,0.8)'; }
        ctx.shadowBlur = 10 * p.life; ctx.fill(); ctx.shadowBlur = 0;
      }
      requestAnimationFrame(animP);
    })();
  }
})();


// ---- LIVE2D + BUBBLES ----
window.addEventListener('load', function() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var MODEL = '/live2d/model/hiyori_free_t08.model3.json';
  var wrap = document.getElementById('lw');
  var hideBtn = document.getElementById('lhide');
  var showBtn = document.getElementById('lshow');
  var bubble = document.getElementById('lbub');
  if (!window.PIXI || !PIXI.live2d) return;
  if (PIXI.live2d.Live2DModel && PIXI.Ticker) PIXI.live2d.Live2DModel.registerTicker(PIXI.Ticker);
  var app = new PIXI.Application({ view: document.getElementById('lc'), autoStart: true, resizeTo: wrap, backgroundAlpha: 0, antialias: true });
  PIXI.live2d.Live2DModel.from(MODEL, { autoInteract: false }).then(function(model) {
    app.stage.addChild(model);
    window.__l2dModel = model;
    function fit() {
      var mh = (model.internalModel && model.internalModel.height) ? model.internalModel.height : model.height;
      model.scale.set((app.renderer.height / mh) * 2.1);
      model.x = app.renderer.width / 2;
      model.y = app.renderer.height * 0.06;
      model.anchor.set(0.5, 0);
    }
    fit(); window.addEventListener('resize', fit);
    var tX = window.innerWidth / 2, tY = window.innerHeight / 2, fX = tX, fY = tY;
    window.addEventListener('mousemove', function(e) { tX = e.clientX; tY = e.clientY; }, { passive: true });
    app.ticker.add(function() { fX += (tX - fX) * 0.06; fY += (tY - fY) * 0.06; model.focus(fX, fY); });
    var MSGS = [
      'Stop poking me! It tickles!',
      'Was that just an accidental touch?',
      "Hey, I'm watching the writeups here",
      'root access denied',
      'Focus on the machines, not me~',
      "One more poke and I'm calling the SOC.",
      'sudo stop that',
      'You found a vuln in my patience.',
      'Permission denied: booping.',
      'Segfault... just kidding'
    ];
    var lastTap = 0, COOL = 2500, bt = null;
    function react() {
      var now = Date.now();
      if (now - lastTap < COOL) return;
      lastTap = now;
      try { model.motion('Tap'); } catch(e) {}
      if (bubble) {
        bubble.textContent = MSGS[Math.floor(Math.random() * MSGS.length)];
        bubble.classList.add('on');
        clearTimeout(bt);
        bt = setTimeout(function() { bubble.classList.remove('on'); }, 3200);
      }
    }
    var cv = document.getElementById('lc');
    if (cv) cv.addEventListener('pointerdown', react);
    try { model.on('hit', react); } catch(e) {}
    hideBtn.addEventListener('click', function() {
      wrap.classList.add('gone');
      setTimeout(function() { wrap.style.display = 'none'; showBtn.style.display = 'flex'; }, 400);
    });
    showBtn.addEventListener('click', function() {
      wrap.style.display = 'block'; showBtn.style.display = 'none';
      requestAnimationFrame(function() { wrap.classList.remove('gone'); });
    });
  }).catch(function(e) { console.warn('[live2d]', e); });
});
</script>
